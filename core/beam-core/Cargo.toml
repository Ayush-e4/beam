[package]
name = "beam-core"
version = "0.1.0"
description = "Beam transfer engine: protocol, transports, crypto and file pipeline."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
snow = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "rt"] }
zeroize = "1.9.2"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
