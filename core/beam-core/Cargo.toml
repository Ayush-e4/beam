[package]
name = "beam-core"
version = "0.1.0"
description = "Beam transfer engine: protocol, transports, crypto and file pipeline."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["native"]
# Sockets, QUIC, the WebTransport server and the tokio-driven transfer loops. Without it the
# crate builds for browsers (wasm32-unknown-unknown): protocol, crypto, framing, handshake.
native = [
  "dep:h3",
  "dep:h3-quinn",
  "dep:h3-webtransport",
  "dep:http",
  "dep:quinn",
  "dep:rcgen",
  "dep:rustls",
  "dep:time",
  "tokio/net",
  "tokio/rt",
  "tokio/sync",
  "tokio/time",
]

[dependencies]
blake3 = "1.8.7"
bytes = "1.12.2"
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", features = ["datagram"], optional = true }
h3-webtransport = { version = "0.1.2", optional = true }
http = { version = "1.5.0", optional = true }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "crypto"], optional = true }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"], optional = true }
snow = { version = "0.10.0", features = ["ring-accelerated"] }
thiserror = "2.0.21"
time = { version = "0.3.55", optional = true }
tokio = { version = "1.54.1", features = ["io-util"] }
zeroize = "1.9.2"
zstd = { version = "0.14.4", default-features = false }

# Browsers have no OS random source: ring and snow then use the page's crypto.getRandomValues
# (getrandom 0.3 also needs the cfg set in core/.cargo/config.toml).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
ring = { version = "0.17.14", features = ["wasm32_unknown_unknown_js"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

# These drive real sockets, so they need the native transports.
[[test]]
name = "loopback_quic"
required-features = ["native"]

[[test]]
name = "loopback_tcp"
required-features = ["native"]

[[test]]
name = "m1_exit_quic"
required-features = ["native"]

[[test]]
name = "m1_exit_tcp"
required-features = ["native"]

[[test]]
name = "tcp_prepare"
required-features = ["native"]

[[test]]
name = "transfer_loopback"
required-features = ["native"]

[[test]]
name = "transfer_done_race"
required-features = ["native"]

[[example]]
name = "webtransport_echo"
required-features = ["native"]

[[example]]
name = "webtransport_peer"
required-features = ["native"]
