[package]
name = "beam-core"
version = "0.1.0"
description = "Beam transfer engine: protocol, transports, crypto and file pipeline."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
bytes = "1.12.2"
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-webtransport = "0.1.2"
http = "1.5.0"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "crypto"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
snow = { version = "0.10.0", features = ["ring-accelerated"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["net", "io-util", "rt", "time"] }
zeroize = "1.9.2"
zstd = { version = "0.14.4", default-features = false }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
