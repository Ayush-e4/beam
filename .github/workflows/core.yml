name: Core (Rust)

on:
  pull_request:
    paths: ['core/**', 'rust-toolchain.toml', '.github/workflows/core.yml']
  push:
    branches: [master]
    paths: ['core/**', 'rust-toolchain.toml', '.github/workflows/core.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Generate Kotlin bindings
        # Proves the exported API still turns into Kotlin; the Android build generates its own.
        run: |
          cargo build --locked -p beam-ffi
          cargo run --locked -p uniffi-bindgen -- generate --no-format \
            --library target/debug/libbeam_ffi.so --language kotlin --out-dir target/kotlin
          test -s target/kotlin/app/beam/core/beam_ffi.kt

  m1-exit:
    # Fault-injection transfers of a 1 GiB file over TCP and lossy QUIC, in release mode. The
    # smaller fault scenarios already run in `check`.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: release
      - name: 1 GiB transfers with injected faults
        run: cargo test --release --locked --test m1_exit_tcp --test m1_exit_quic -- --ignored --nocapture
