name: Core (Rust)

on:
  pull_request:
    paths:
      [
        'core/**',
        'signal/**',
        'tools/web-engine-test.sh',
        'tools/signal-room-test.sh',
        'rust-toolchain.toml',
        '.github/workflows/core.yml',
      ]
  push:
    branches: [master]
    paths:
      [
        'core/**',
        'signal/**',
        'tools/web-engine-test.sh',
        'tools/signal-room-test.sh',
        'rust-toolchain.toml',
        '.github/workflows/core.yml',
      ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Generate Kotlin bindings
        # Proves the exported API still turns into Kotlin; the Android build generates its own.
        run: |
          cargo build --locked -p beam-ffi
          cargo run --locked -p uniffi-bindgen -- generate --no-format \
            --library target/debug/libbeam_ffi.so --language kotlin --out-dir target/kotlin
          test -s target/kotlin/app/beam/core/beam_ffi.kt

  wasm:
    # The engine without its native transports must keep building for browsers.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: wasm
      - name: Join the room service (signal/, under Wrangler) with the signaling client
        env:
          WRANGLER_SEND_METRICS: false
        run: tools/signal-room-test.sh
      - name: Use clang for the C parts (ring, zstd)
        run: |
          echo "CC_wasm32_unknown_unknown=clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$(command -v llvm-ar || ls /usr/bin/llvm-ar-* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Clippy for wasm32
        run: cargo clippy --locked -p beam-core --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy (beam-web for browsers, with its browser tests)
        run: cargo clippy --locked -p beam-web --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Test without the native transports
        run: cargo test --locked -p beam-core --no-default-features

  web-engine:
    # The WebAssembly engine in headless Chromium pairs with a native peer over WebTransport,
    # then beam-web's browser-only tests (OPFS staging in a dedicated worker) run there too.
    # beam-core's signaling client also joins the real room service, run locally by Wrangler.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: web-engine
      - uses: taiki-e/install-action@v2
        with:
          # Must match the wasm-bindgen crate in core/Cargo.lock; the test script checks.
          tool: wasm-bindgen-cli@0.2.130
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Node packages and Chromium
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Use clang for the C parts (ring, zstd)
        run: |
          echo "CC_wasm32_unknown_unknown=clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$(command -v llvm-ar || ls /usr/bin/llvm-ar-* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Pair the browser engine with a native peer, then run the browser tests
        run: tools/web-engine-test.sh

  m1-exit:
    # Fault-injection transfers of a 1 GiB file over TCP and lossy QUIC, in release mode. The
    # smaller fault scenarios already run in `check`.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: release
      - name: 1 GiB transfers with injected faults
        run: cargo test --release --locked --test m1_exit_tcp --test m1_exit_quic -- --ignored --nocapture
